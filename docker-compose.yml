services:
  db:
    image: postgres:15-alpine
    container_name: judge_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Shared store for rate limiting (rateLimiter.js) and response caching
  # (cache.js) — without this, both fall back to per-replica in-memory
  # state, which still works but means each backend replica enforces its
  # own separate rate-limit counters and cache instead of one shared view.
  # No auth/persistence configured: this is internal-network-only (no
  # ports: mapping to the host), never reachable from outside the compose
  # network, and losing its data on restart just means caches/counters
  # reset, not data loss.
  redis:
    image: redis:7-alpine
    container_name: judge_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The app itself. No `ports:` mapping to the host on purpose — nginx is
  # the only thing that should be reachable from outside this machine;
  # every backend replica is only reachable over the internal compose
  # network, at the shared hostname `backend` (Docker's embedded DNS
  # round-robins across however many replicas are running under that name,
  # which is what makes nginx's resolver-based upstream below able to
  # load-balance across them). Scale with:
  #   docker compose up --scale backend=3 -d
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever DATABASE_URL/REDIS_URL are set to in
      # backend/.env (Compose's `environment:` wins over `env_file:` for
      # the same key) — every other secret in that file (JWT_SECRET,
      # RAZORPAY_*, GMAIL_*, B2_*, ...) passes through unchanged. Point
      # DATABASE_URL at an external managed Postgres instead by deleting
      # this override if you don't want the local `db` container.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # The local `db` container doesn't speak TLS at all — see DB_SSL's
      # own comment in index.js. Remove this if DATABASE_URL above is
      # pointed at a real managed/TLS-terminated Postgres instead.
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # A runaway code-execution request (an infinite loop in student
          # code, a huge input) should degrade one replica, not starve the
          # host out from under every other replica and the DB. Tune to
          # whatever this box's actual per-core budget looks like.
          cpus: '1.0'
          memory: 1G

  # The load balancer — the one thing actually reachable from outside this
  # machine. Round-robins across every `backend` replica currently running
  # (see nginx.conf's own comment on the resolver directive that makes
  # that work with Compose's --scale rather than a fixed, stale IP list).
  nginx:
    image: nginx:1.27-alpine
    container_name: judge_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
