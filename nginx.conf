worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker Compose's embedded DNS server. A plain `upstream { server
    # backend:3000; }` block resolves that hostname to an IP exactly once,
    # at nginx startup — `docker compose up --scale backend=N` afterward
    # adds/removes containers under that same DNS name, but nginx would
    # never notice and would keep hammering whichever single IP it first
    # resolved. Setting a resolver and re-resolving `backend` in a
    # variable (see the `set $backend_upstream` below) instead makes nginx
    # re-look-up the name periodically, picking up scale changes without a
    # config reload or restart. This is the standard nginx+Compose pattern
    # for load-balancing across a service you scale at runtime.
    resolver 127.0.0.11 valid=10s;

    # Real client IP for the app's own rate limiter (rateLimiter.js keys on
    # IP) — without this, every request nginx forwards would appear to
    # come from nginx's own container IP, and the whole platform would
    # share one rate-limit bucket instead of one per real visitor.
    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     'upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Code execution / OCR / AI-grading requests genuinely take longer than
    # a typical CRUD request — these are generous on purpose so the load
    # balancer doesn't cut a legitimately slow-but-working request off
    # before the backend itself would time it out.
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    server {
        listen 80;
        client_max_body_size 25m; # scanned-assignment PDF uploads

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            set $backend_upstream backend:3000;
            proxy_pass http://$backend_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade headers — harmless no-op for this app's
            # current plain-HTTP/REST routes, cheap insurance if that ever
            # changes.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # One retry against a different backend replica if the one
            # nginx picked is refusing connections or timing out entirely
            # — NOT retried on a real application error (a 4xx/5xx the
            # backend deliberately returned, e.g. this app's own 429/503),
            # since retrying those would just hit the same rate limit or
            # overload signal again on a different replica.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }
    }
}
