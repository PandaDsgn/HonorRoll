<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HonorRoll</title>
  <!-- Load CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
  <style>
    body { font-family: system-ui, sans-serif; background: #1e1e1e; color: white; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }

    /* Login Screen Styles */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .login-box { background: #2d2d2d; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 300px; text-align: center; }
    .login-box input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #444; background: #1e1e1e; color: white; font-size: 16px; }
    .login-box button { width: 100%; padding: 12px; margin-top: 15px; background: #007bff; color: white; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    .login-box button:hover { background: #0056b3; }
    #login-error { color: #ff4444; margin-top: 10px; font-size: 14px; min-height: 20px; }

    /* Main App Styles (Hidden by default) */
    #app-screen { display: none; padding: 20px; flex-direction: column; height: 100%; box-sizing: border-box; }
    .header { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; justify-content: space-between; }
    .controls { display: flex; gap: 10px; }
    select, button { padding: 8px 16px; font-size: 16px; cursor: pointer; border-radius: 4px; border: none; }
    .btn-run { background: #28a745; color: white; font-weight: bold; }
    .btn-run:hover { background: #218838; }
    .btn-logout { background: #dc3545; color: white; font-weight: bold; }
    .btn-logout:hover { background: #c82333; }
    .CodeMirror { height: 400px; border-radius: 4px; font-size: 16px; border: 1px solid #444; }
    #output { background: #000; padding: 15px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; flex-grow: 1; margin-top: 10px; color: #00ff00; overflow-y: auto; }
    .error { color: #ff4444 !important; }
  </style>
</head>
<body>

  <!-- ============================== -->
  <!-- 1. THE LOGIN SCREEN -->
  <!-- ============================== -->
  <div id="login-screen">
    <div class="login-box">
      <h2>HonorRoll Login</h2>
      <input type="email" id="email" placeholder="Student Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button onclick="handleLogin()">Sign In</button>
      <div id="login-error"></div>
    </div>
  </div>

  <!-- ============================== -->
  <!-- 2. THE SANDBOX (HIDDEN) -->
  <!-- ============================== -->
  <div id="app-screen">
    <div class="header">
      <h2>HonorRoll Sandbox</h2>
      <div class="controls">
        <select id="language">
          <option value="python">Python</option>
          <option value="c">C</option>
          <option value="java">Java</option>
        </select>
        <button class="btn-run" id="runBtn" onclick="runCode()">Run Code</button>
        <button class="btn-logout" onclick="handleLogout()">Logout</button>
      </div>
    </div>

    <textarea id="editor"></textarea>
    <h3>Console Output:</h3>
    <div id="output">Waiting for code execution...</div>
  </div>

  <!-- Load CodeMirror Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>

  <script>
    // --- Auth Logic ---
    async function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('login-error');

      errorDiv.innerText = "";

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Success! Hide login, show the app
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('app-screen').style.display = 'flex';

          // The backend automatically set an httpOnly cookie, so we are authenticated!
        } else {
          errorDiv.innerText = data.error || "Login failed";
        }
      } catch (err) {
        errorDiv.innerText = "Network error. Is the server running?";
      }
    }

    function handleLogout() {
      // In a full app, we would hit a /api/logout endpoint to clear the cookie.
      // For now, reloading the page resets the UI state back to the login screen.
      window.location.reload();
    }

    // --- Editor Logic ---
    const editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
      lineNumbers: true,
      theme: "monokai",
      mode: "python"
    });

    editor.setValue('print("Hello from HonorRoll!")');

    document.getElementById('language').addEventListener('change', (e) => {
      const lang = e.target.value;
      if (lang === 'python') {
        editor.setOption('mode', 'python');
        editor.setValue('print("Hello from Python!")');
      } else if (lang === 'c') {
        editor.setOption('mode', 'text/x-csrc');
        editor.setValue('#include <stdio.h>\n\nint main() {\n    printf("Hello from C!\\n");\n    return 0;\n}');
      } else if (lang === 'java') {
        editor.setOption('mode', 'text/x-java');
        editor.setValue('public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello from Java!");\n    }\n}');
      }
    });

    async function runCode() {
      const runBtn = document.getElementById('runBtn');
      const outputDiv = document.getElementById('output');
      const language = document.getElementById('language').value;
      const code = editor.getValue();

      runBtn.innerText = "Running...";
      runBtn.disabled = true;
      outputDiv.innerText = "Executing in secure container...";
      outputDiv.classList.remove('error');

      try {
        const response = await fetch(`/api/execute/${language}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code })
        });

        const data = await response.json();

        if (!response.ok) {
          outputDiv.classList.add('error');
          outputDiv.innerText = data.error || "Execution failed";
        } else {
          outputDiv.innerText = data.output;
        }
      } catch (err) {
        outputDiv.classList.add('error');
        outputDiv.innerText = "Network error: Could not reach the server.";
      }

      runBtn.innerText = "Run Code";
      runBtn.disabled = false;
    }
  </script>
</body>
</html>
